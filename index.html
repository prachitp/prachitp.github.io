<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Prachit Puranik</title>

  <!-- SEO: fresh metadata that replaces the previous content -->
  <meta name="description" content="Prachit Puranik - personal website. Coming soon.">
  <meta name="author" content="Prachit Puranik">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://prachit-puranik.com/">

  <!-- Open Graph / link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Prachit Puranik">
  <meta property="og:description" content="Personal website - coming soon.">
  <meta property="og:url" content="https://prachit-puranik.com/">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Prachit Puranik">
  <meta name="twitter:description" content="Personal website - coming soon.">

  <!-- Person schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Prachit Puranik",
    "url": "https://prachit-puranik.com/"
  }
  </script>

  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6ea8fe;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p.tagline {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }
    p.note {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Work in Progress</span>
    <h1>Prachit Puranik</h1>
    <p class="tagline">This site is currently being built.</p>
    <div class="divider"></div>
    <p class="note">
      Thanks for stopping by &mdash; my personal website is under construction
      and will be live here soon.
    </p>
    <p class="footer">&copy; Prachit Puranik</p>
  </main>
</body>
</html>
